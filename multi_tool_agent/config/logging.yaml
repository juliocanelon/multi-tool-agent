version: 1
formatters:
  standard:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
handlers:
  console:
    class: logging.StreamHandler
    formatter: standard
    level: INFO
    stream: ext://sys.stdout
loggers:
  multi_tool_agent:
    handlers: [console]
    level: INFO
    propagate: false
root:
  handlers: [console]
  level: INFO
